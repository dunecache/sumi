# Robolectric settings for the JVM UI-test harness (app/src/test).
#
# The tests render real Compose screens with the debug manifest and resources, so they
# run in CI (`./gradlew :app:testDebugUnitTest`) without a device or emulator.
#
# SDK is pinned to 34: Robolectric ships a matching android-all jar for it, and it is
# close enough to the app's compileSdk 35 for the screens under test.
sdk=34

# Native graphics mode: Compose needs real rendering (not the legacy no-op canvas) to
# lay out and measure text, so semantics assertions see what a user would see.
graphicsMode=NATIVE
