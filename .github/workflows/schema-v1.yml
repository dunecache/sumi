name: schema-v1
on:
  pull_request:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Export Room v1 schema
        run: ./gradlew :app:kspDebugKotlin --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: schemas
          path: app/schemas
