name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Android lint
        run: ./gradlew :app:lintDebug --no-daemon --stacktrace
      - name: ktlint (domain only; Android covered by lintDebug + detekt)
        run: ./gradlew :domain:ktlintCheck --no-daemon --stacktrace
      - name: detekt
        run: ./gradlew :domain:detekt :app:detekt --no-daemon --stacktrace
      - name: Upload lint reports
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: |
            app/build/reports/lint-results-debug.*
            **/build/reports/detekt/
          if-no-files-found: warn
